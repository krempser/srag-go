    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "umidade_relativa_pct"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: false
    category: climatico
    descricao: "Umidade relativa média mensal (%) — NASA POWER"

