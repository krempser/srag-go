# ==============================================================================
# CAMADAS AMBIENTAIS (MapBiomas + ERA5-Land + qualidade do ar + fogo)
# ==============================================================================
# MapBiomas: arquivo gerado por src/convert_mapbiomas.py
# ERA5-Land:  arquivo gerado por src/fetch_era5_land.py
# Para incluir no modelo, as variáveis abaixo JÁ estão ativas.
# Para ERA5 (ainda não gerado), descomente os blocos era5_* no final.
# ------------------------------------------------------------------------------

# MapBiomas — cobertura do solo (classes nível 1, Coleção 10.1)
# Dados: 1985–2024, anuais (interpolados para mensal pelo pipeline)

  mapbiomas_pct_farming:
    file: "processed/mapbiomas_classes_pct.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "pct_farming"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: true
    category: ambiental
    descricao: "% do território com uso Agropecuária (MapBiomas class_level_1=3. Farming)"

  mapbiomas_pct_forest:
    file: "processed/mapbiomas_classes_pct.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "pct_forest"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: true
    category: ambiental
    descricao: "% do território com Floresta (MapBiomas class_level_1=1. Forest)"

  mapbiomas_pct_non_forest_natural:
    file: "processed/mapbiomas_classes_pct.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "pct_non_forest_natural_formation"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: true
    category: ambiental
    descricao: "% do território com Formação Natural Não Florestal (Cerrado, campo, etc.)"

  mapbiomas_pct_non_vegetated:
    file: "processed/mapbiomas_classes_pct.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "pct_non_vegetated_area"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: true
    category: ambiental
    descricao: "% do território sem vegetação: área urbana, mineração, solo exposto"

  mapbiomas_pct_water:
    file: "processed/mapbiomas_classes_pct.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "pct_water_and_marine_environment"}
    date_format: "%Y-%m"
    value_type: percent
    interpolate: true
    category: ambiental
    descricao: "% do território com corpos d'água (rios, lagos, represas)"

# ---------------------------------------------------------------------------
# METEOROLOGIA — NASA POWER (temperatura, precipitação, umidade)
# Gerar com: python src/fetch_meteorologico.py --uf GO --years 2017-2025
# Descomente os blocos abaixo após gerar data/processed/meteorologico_go.csv
# ---------------------------------------------------------------------------

  meteo_temp_media:
