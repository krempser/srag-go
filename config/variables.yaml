    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "temp_max_c"}
    date_format: "%Y-%m"
    value_type: temperature
    interpolate: false
    category: climatico
    descricao: "Temperatura máxima mensal (°C) — NASA POWER"

  meteo_temp_amplitude:
    file: "processed/meteorologico_go.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "temp_amplitude_c"}
    date_format: "%Y-%m"
    value_type: temperature
    interpolate: false
    category: climatico
    descricao: "Amplitude térmica mensal Tmax-Tmin (°C) — NASA POWER"

  meteo_precipitacao:
    file: "processed/meteorologico_go.csv"
    parser: long_month
    cols: {cod_mun: "cod_mun", data: "ano_mes", valor: "precip_mm"}
    date_format: "%Y-%m"
    value_type: precipitation
    interpolate: false
    category: climatico
